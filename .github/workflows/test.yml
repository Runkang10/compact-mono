name: Test
on:
  push:
    branches: [ '**' ]
    paths: [ gradle/**, src/**, '*.kts', gradle.properties ]
  pull_request:
    paths: [ gradle/**, src/**, '*.kts', gradle.properties ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run tests
        run: ./gradlew test